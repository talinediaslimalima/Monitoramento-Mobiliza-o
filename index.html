
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Monitoramento</title>

<!-- =========================
     FONTES
========================= -->

<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&display=swap" rel="stylesheet">


<style>

/* =====================================================
   CONFIGURAÇÕES GERAIS
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    background: #eebf00;

    overflow: hidden;
}


/* =====================================================
   CABEÇALHO
===================================================== */

header {

    width: 100%;

    /*
       Cabeçalho compacto.
       O mapa ganha praticamente todo
       o espaço vertical restante.
    */
    height: 64px;
    min-height: 64px;

    background: #eebf00;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 4px 28px;

    position: relative;
    z-index: 10;
}


/* =====================================================
   ÁREA DOS TÍTULOS
===================================================== */

.titulo {

    display: flex;
    align-items: center;

    min-width: 0;

    /*
       Permite que os títulos ocupem
       o máximo de espaço disponível.
    */
    flex: 1;
}


/* =====================================================
   TÍTULO PRINCIPAL
===================================================== */

.titulo h1 {

    color: #e3372f;

    font-family: "Archivo Black", sans-serif;

    /*
       Título principal maior.
    */
    font-size: clamp(20px, 2.2vw, 31px);

    line-height: 1;

    white-space: nowrap;
}


/* =====================================================
   SEPARADOR
===================================================== */

.separador {

    color: #e3372f;

    font-family: Arial, sans-serif;

    font-size: clamp(18px, 2vw, 27px);

    font-weight: 400;

    margin: 0 12px;

    line-height: 1;
}


/* =====================================================
   SEGUNDO TÍTULO
===================================================== */

.titulo p {

    color: #e3372f;

    font-family: "Bebas Neue", sans-serif;

    /*
       Menor que o título principal.
    */
    font-size: clamp(16px, 1.6vw, 23px);

    line-height: 1;

    letter-spacing: 0.5px;

    white-space: nowrap;
}


/* =====================================================
   LOGO
===================================================== */

.logo {

    display: flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;

    margin-left: 18px;
}


.logo img {

    display: block;

    width: auto;

    /*
       Logo compacta para acompanhar
       a altura reduzida do cabeçalho.
    */
    height: clamp(38px, 4.2vw, 54px);

    object-fit: contain;
}


/* =====================================================
   ÁREA DO MAPA
===================================================== */

main {

    /*
       Ocupa TODO o espaço que sobra
       depois do cabeçalho.
    */
    flex: 1;

    width: 100%;

    min-height: 0;

    background: #eebf00;

    /*
       Espaçamento mínimo ao redor do mapa.
    */
    padding: 0 4px 4px 4px;
}


/* =====================================================
   MAPA
===================================================== */

iframe {

    display: block;

    width: 100%;
    height: 100%;

    border: none;

    border-radius: 8px;

    background: white;

    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.16);
}


/* =====================================================
   TABLETS
===================================================== */

@media (max-width: 900px) {

    header {

        height: 58px;
        min-height: 58px;

        padding: 3px 18px;
    }


    .titulo h1 {

        font-size: clamp(18px, 3.2vw, 27px);
    }


    .separador {

        font-size: clamp(17px, 2.8vw, 24px);

        margin: 0 8px;
    }


    .titulo p {

        font-size: clamp(15px, 2.2vw, 20px);
    }


    .logo {

        margin-left: 12px;
    }


    .logo img {

        height: clamp(34px, 5.8vw, 48px);
    }

}


/* =====================================================
   CELULAR
===================================================== */

@media (max-width: 600px) {

    header {

        height: 54px;
        min-height: 54px;

        padding: 3px 10px;

        gap: 6px;
    }


    .titulo {

        flex: 1;

        min-width: 0;

        overflow: hidden;
    }


    .titulo h1 {

        font-size: clamp(14px, 4.4vw, 19px);

        white-space: nowrap;
    }


    .separador {

        font-size: clamp(14px, 4vw, 18px);

        margin: 0 5px;
    }


    .titulo p {

        font-size: clamp(12px, 3.5vw, 16px);

        white-space: nowrap;
    }


    .logo {

        margin-left: 4px;
    }


    .logo img {

        height: 39px;

        max-width: 82px;
    }


    main {

        padding: 0 3px 3px 3px;
    }


    iframe {

        border-radius: 6px;
    }

}


/* =====================================================
   CELULARES MUITO PEQUENOS
===================================================== */

@media (max-width: 380px) {

    header {

        height: 50px;
        min-height: 50px;

        padding: 2px 7px;

        gap: 4px;
    }


    .titulo h1 {

        font-size: 13px;
    }


    .separador {

        font-size: 13px;

        margin: 0 3px;
    }


    .titulo p {

        font-size: 11px;
    }


    .logo {

        margin-left: 2px;
    }


    .logo img {

        height: 36px;

        max-width: 72px;
    }


    main {

        padding: 0 2px 2px 2px;
    }


    iframe {

        border-radius: 5px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     CABEÇALHO
===================================================== -->

<header>


    <!-- TÍTULOS -->

    <div class="titulo">

        <h1>
            PAINEL DE MONITORAMENTO
        </h1>


        <span class="separador">
            |
        </span>


        <p>
            MOBILIZAÇÃO DO FORMIGUEIRO
        </p>

    </div>


    <!-- LOGO -->

    <div class="logo">

        <img
            src="img/logo2.png"
            alt="Logo"
        >

    </div>


</header>



<!-- =====================================================
     ÁREA DO MAPA
===================================================== -->

<main>

    <iframe
        src="https://www.google.com/maps/d/embed?mid=1ykJ8VhRi6gO1UCM3F0kdEszjRUlsqIQ&ehbc=2E312F&noprof=1"
        allowfullscreen>
    </iframe>

</main>


</body>

</html>
