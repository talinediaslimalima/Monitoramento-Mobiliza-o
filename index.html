<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel do Mapa</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
flex-direction:column;
background:#efd0e7;
font-family:'Montserrat',sans-serif;
}

header{
height:78px;
background:#14773d;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 22px;
position:relative;
overflow:hidden;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

header::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:8px;
background:#ef9400;
}

header::after{
content:"";
position:absolute;
left:-70px;
bottom:-65px;
width:220px;
height:150px;
background:#d9a8d6;
transform:rotate(-18deg);
opacity:.8;
}

.titulo{
z-index:2;
display:flex;
flex-direction:column;
}

.titulo h1{
display:inline-block;
width:fit-content;
background:white;
padding:6px 16px;
color:#222;
font-size:25px;
font-family:'Baloo 2',cursive;
transform:rotate(-2deg);
border-radius:5px;
box-shadow:3px 3px 0 rgba(0,0,0,.12);
line-height:1;
}

.titulo p{
display:inline-block;
width:fit-content;
margin-top:6px;
padding:4px 14px;
background:#5c3ca9;
color:white;
font-size:13px;
font-weight:600;
border-radius:5px;
transform:rotate(-1deg);
}

.logo{
z-index:2;
display:flex;
align-items:center;
justify-content:center;
}

.logo img{
height:52px;
display:block;
filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));
}

main{
flex:1;
padding:8px;
background:#efd0e7;
}

iframe{
width:100%;
height:100%;
border:none;
border-radius:10px;
background:white;
padding:3px;
box-shadow:0 6px 18px rgba(0,0,0,.18);
}

@media(max-width:700px){

header{
height:70px;
padding:0 12px;
}

.titulo h1{
font-size:18px;
padding:5px 10px;
}

.titulo p{
font-size:11px;
padding:3px 10px;
margin-top:5px;
}

.logo img{
height:42px;
}

main{
padding:4px;
}

iframe{
border-radius:8px;
padding:2px;
}

}

</style>

</head>

<body>

<header>

<div class="titulo">

<h1>Painel de Monitoramento</h1>

<p>Mobilização</p>

</div>

<div class="logo">

<img src="img/logo.png" alt="Logo">

</div>

</header>

<main>

<iframe
src="https://www.google.com/maps/d/embed?mid=1ykJ8VhRi6gO1UCM3F0kdEszjRUlsqIQ&ehbc=2E312F&noprof=1"
allowfullscreen>
</iframe>

</main>

</body>
</html>
