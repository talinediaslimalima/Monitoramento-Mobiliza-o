<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel do Mapa</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;
display:flex;
flex-direction:column;

background:#efd0e7;

font-family:'Montserrat',sans-serif;

}

/*----------------------------------*/

header{

height:95px;

background:#14773d;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 35px;

position:relative;

overflow:hidden;

box-shadow:0 5px 15px rgba(0,0,0,.15);

}

/* faixa laranja */

header::before{

content:"";

position:absolute;

top:0;

left:0;

width:100%;

height:12px;

background:#ef9400;

}

/* formas decorativas */

header::after{

content:"";

position:absolute;

left:-70px;

bottom:-60px;

width:250px;

height:180px;

background:#d9a8d6;

transform:rotate(-18deg);

opacity:.8;

}

/*----------------------------------*/

.titulo{

z-index:2;

display:flex;

flex-direction:column;

}

/* bloco branco */

.titulo h1{

display:inline-block;

width:fit-content;

background:white;

padding:8px 22px;

color:#222;

font-size:32px;

font-family:'Baloo 2',cursive;

transform:rotate(-2deg);

border-radius:6px;

box-shadow:4px 4px 0 rgba(0,0,0,.12);

}

/* bloco roxo */

.titulo p{

display:inline-block;

width:fit-content;

margin-top:10px;

padding:6px 18px;

background:#5c3ca9;

color:white;

font-weight:600;

border-radius:6px;

transform:rotate(-1deg);

}

/*----------------------------------*/

/* Logo sem fundo */

.logo{

z-index:2;

}

.logo img{

height:62px;

display:block;

filter:drop-shadow(0 3px 5px rgba(0,0,0,.25));

}

/*----------------------------------*/

main{

flex:1;

padding:18px;

background:#efd0e7;

}

iframe{

width:100%;

height:100%;

border:none;

border-radius:20px;

background:white;

padding:8px;

box-shadow:0 12px 30px rgba(0,0,0,.20);

}

</style>

</head>

<body>

<header>

<div class="titulo">

<h1>Painel de Monitoramento</h1>

<p>Mobilização</p>

</div>

<div class="logo">

<img src="img/logo.png" alt="Logo">

</div>

</header>


<main>

<iframe
src="https://www.google.com/maps/d/embed?mid=1V-BnzF9oAk8mIQBu2ZP4P-TsM9DQd38"
allowfullscreen>
</iframe>

</main>

</body>
</html>
